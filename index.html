<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>GPS Check</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Syne:wght@400;700;800&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --green:  #22c55e;
    --yellow: #f59e0b;
    --red:    #ef4444;
    --dim:    #1e1e1e;
    --bg:     #0a0a0a;
    --card:   #141414;
    --border: #2a2a2a;
    --text:   #f0f0f0;
    --muted:  #6b6b6b;
    --accent: #22c55e;
  }

  html, body {
    min-height: 100vh;
    background: var(--bg);
    color: var(--text);
    font-family: 'Syne', sans-serif;
    overscroll-behavior: none;
  }

  body {
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 0;
    min-height: 100dvh;
  }

  header {
    width: 100%;
    padding: 52px 24px 20px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    border-bottom: 1px solid var(--border);
  }

  .logo {
    font-size: 18px;
    font-weight: 800;
    letter-spacing: -0.5px;
    color: var(--text);
  }

  .logo span {
    color: var(--accent);
  }

  .badge-auto {
    font-family: 'DM Mono', monospace;
    font-size: 11px;
    color: var(--muted);
    border: 1px solid var(--border);
    border-radius: 20px;
    padding: 4px 10px;
    letter-spacing: 0.5px;
  }

  main {
    width: 100%;
    max-width: 420px;
    padding: 28px 20px 40px;
    display: flex;
    flex-direction: column;
    gap: 16px;
    flex: 1;
  }

  .light-card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 20px;
    padding: 32px 24px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 24px;
  }

  .traffic-light {
    background: #0f0f0f;
    border: 1px solid var(--border);
    border-radius: 40px;
    padding: 14px 10px;
    display: flex;
    flex-direction: column;
    gap: 10px;
    align-items: center;
    width: 68px;
  }

  .bulb {
    width: 36px;
    height: 36px;
    border-radius: 50%;
    transition: background 0.5s, box-shadow 0.5s, opacity 0.5s;
    opacity: 0.12;
  }

  .bulb.active-red    { background: var(--red);    opacity: 1; box-shadow: 0 0 18px var(--red); }
  .bulb.active-yellow { background: var(--yellow); opacity: 1; box-shadow: 0 0 18px var(--yellow); }
  .bulb.active-green  { background: var(--green);  opacity: 1; box-shadow: 0 0 18px var(--green); }
  .bulb.off-red    { background: var(--red); }
  .bulb.off-yellow { background: var(--yellow); }
  .bulb.off-green  { background: var(--green); }

  .status-text {
    text-align: center;
  }

  .status-label {
    font-size: 26px;
    font-weight: 800;
    letter-spacing: -1px;
    line-height: 1;
    color: var(--accent);
    transition: color 0.4s;
    margin-bottom: 6px;
  }

  .status-desc {
    font-family: 'DM Mono', monospace;
    font-size: 13px;
    color: var(--muted);
    letter-spacing: 0.2px;
  }

  .metrics-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
    width: 100%;
  }

  .metric {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 14px 16px;
  }

  .metric-label {
    font-family: 'DM Mono', monospace;
    font-size: 10px;
    color: var(--muted);
    letter-spacing: 1px;
    text-transform: uppercase;
    margin-bottom: 6px;
  }

  .metric-value {
    font-size: 20px;
    font-weight: 700;
    color: var(--text);
    letter-spacing: -0.5px;
  }

  .metric-unit {
    font-family: 'DM Mono', monospace;
    font-size: 11px;
    color: var(--muted);
    margin-left: 3px;
  }

  .coord-card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 14px 16px;
  }

  .coord-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 5px 0;
  }

  .coord-row + .coord-row {
    border-top: 1px solid var(--border);
  }

  .coord-key {
    font-family: 'DM Mono', monospace;
    font-size: 11px;
    color: var(--muted);
    letter-spacing: 0.5px;
  }

  .coord-val {
    font-family: 'DM Mono', monospace;
    font-size: 13px;
    color: var(--text);
    font-weight: 500;
  }

  .btn-wrap {
    display: flex;
    gap: 10px;
    width: 100%;
  }

  .btn-primary {
    flex: 1;
    background: var(--accent);
    color: #000;
    border: none;
    border-radius: 14px;
    padding: 17px;
    font-family: 'Syne', sans-serif;
    font-size: 16px;
    font-weight: 700;
    cursor: pointer;
    letter-spacing: -0.3px;
    transition: opacity 0.15s, transform 0.1s;
  }

  .btn-primary:active { opacity: 0.8; transform: scale(0.98); }
  .btn-primary:disabled { opacity: 0.35; cursor: not-allowed; }

  .btn-secondary {
    background: var(--card);
    color: var(--text);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 17px 20px;
    font-family: 'Syne', sans-serif;
    font-size: 15px;
    font-weight: 700;
    cursor: pointer;
    transition: opacity 0.15s;
  }

  .btn-secondary:active { opacity: 0.6; }

  .log-card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 14px;
    overflow: hidden;
  }

  .log-header {
    font-family: 'DM Mono', monospace;
    font-size: 10px;
    letter-spacing: 1px;
    text-transform: uppercase;
    color: var(--muted);
    padding: 10px 16px;
    border-bottom: 1px solid var(--border);
  }

  .log-list {
    list-style: none;
    max-height: 140px;
    overflow-y: auto;
  }

  .log-item {
    display: flex;
    gap: 10px;
    align-items: flex-start;
    padding: 8px 16px;
    border-bottom: 1px solid var(--border);
    font-family: 'DM Mono', monospace;
    font-size: 12px;
  }

  .log-item:last-child { border-bottom: none; }

  .log-time { color: var(--muted); flex-shrink: 0; }
  .log-msg  { color: var(--text); }

  .dot {
    width: 7px;
    height: 7px;
    border-radius: 50%;
    margin-top: 3px;
    flex-shrink: 0;
  }

  .dot-green  { background: var(--green); }
  .dot-yellow { background: var(--yellow); }
  .dot-red    { background: var(--red); }
  .dot-gray   { background: var(--muted); }

  .pulsing {
    animation: pulse 1.4s ease-in-out infinite;
  }

  @keyframes pulse {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.4; }
  }

  .watch-indicator {
    font-family: 'DM Mono', monospace;
    font-size: 11px;
    color: var(--green);
    display: flex;
    align-items: center;
    gap: 6px;
  }

  .watch-dot {
    width: 7px;
    height: 7px;
    border-radius: 50%;
    background: var(--green);
    animation: pulse 1.2s ease-in-out infinite;
  }
</style>
</head>
<body>

<header>
  <div class="logo">GPS<span>.</span>check</div>
  <div id="watch-status"></div>
</header>

<main>
  <div class="light-card">
    <div class="traffic-light">
      <div class="bulb off-red"    id="b-red"></div>
      <div class="bulb off-yellow" id="b-yellow"></div>
      <div class="bulb off-green"  id="b-green"></div>
    </div>
    <div class="status-text">
      <div class="status-label" id="status-label">In attesa</div>
      <div class="status-desc"  id="status-desc">Premi per avviare il controllo GPS</div>
    </div>
  </div>

  <div class="metrics-grid">
    <div class="metric">
      <div class="metric-label">Accuratezza</div>
      <div class="metric-value" id="m-accuracy">—<span class="metric-unit"></span></div>
    </div>
    <div class="metric">
      <div class="metric-label">Satelliti stimati</div>
      <div class="metric-value" id="m-sats">—</div>
    </div>
    <div class="metric">
      <div class="metric-label">Velocità</div>
      <div class="metric-value" id="m-speed">—<span class="metric-unit"></span></div>
    </div>
    <div class="metric">
      <div class="metric-label">Altitudine</div>
      <div class="metric-value" id="m-altitude">—<span class="metric-unit"></span></div>
    </div>
  </div>

  <div class="coord-card">
    <div class="coord-row">
      <span class="coord-key">LAT</span>
      <span class="coord-val" id="m-lat">—</span>
    </div>
    <div class="coord-row">
      <span class="coord-key">LON</span>
      <span class="coord-val" id="m-lon">—</span>
    </div>
    <div class="coord-row">
      <span class="coord-key">AGGIORNATO</span>
      <span class="coord-val" id="m-time">—</span>
    </div>
  </div>

  <div class="btn-wrap">
    <button class="btn-primary" id="btn-main" onclick="startCheck()">Avvia controllo</button>
    <button class="btn-secondary" id="btn-stop" onclick="stopWatch()" style="display:none">Stop</button>
  </div>

  <div class="log-card">
    <div class="log-header">Log eventi</div>
    <ul class="log-list" id="log-list">
      <li class="log-item">
        <div class="dot dot-gray"></div>
        <span class="log-time" id="log-init-time">--:--:--</span>
        <span class="log-msg">App avviata, in attesa</span>
      </li>
    </ul>
  </div>
</main>

<script>
  let watchId = null;

  document.getElementById('log-init-time').textContent = now();

  function now() {
    return new Date().toLocaleTimeString('it-IT');
  }

  function addLog(msg, color) {
    const list = document.getElementById('log-list');
    const li = document.createElement('li');
    li.className = 'log-item';
    li.innerHTML = `<div class="dot dot-${color}"></div><span class="log-time">${now()}</span><span class="log-msg">${msg}</span>`;
    list.appendChild(li);
    li.scrollIntoView({ behavior: 'smooth' });
  }

  function setLight(state) {
    const bulbs = { red: document.getElementById('b-red'), yellow: document.getElementById('b-yellow'), green: document.getElementById('b-green') };
    Object.entries(bulbs).forEach(([k, el]) => {
      el.className = 'bulb ' + (k === state ? 'active-' + k : 'off-' + k);
    });
    const label = document.getElementById('status-label');
    const desc  = document.getElementById('status-desc');
    if (state === 'green')  { label.style.color = '#22c55e'; label.textContent = 'Segnale ottimo';  desc.textContent = 'GPS preciso e stabile'; }
    if (state === 'yellow') { label.style.color = '#f59e0b'; label.textContent = 'Segnale debole';  desc.textContent = 'Copertura limitata, attendi…'; }
    if (state === 'red')    { label.style.color = '#ef4444'; label.textContent = 'Nessun segnale'; desc.textContent = 'GPS non disponibile'; }
  }

  function estimateSats(accuracy) {
    if (accuracy <= 5)  return '12+';
    if (accuracy <= 10) return '8–12';
    if (accuracy <= 25) return '4–7';
    if (accuracy <= 50) return '2–4';
    return '0–2';
  }

  function classifyAccuracy(acc) {
    if (acc <= 15)  return 'green';
    if (acc <= 50)  return 'yellow';
    return 'red';
  }

  function updateMetrics(pos) {
    const c = pos.coords;
    const acc = Math.round(c.accuracy);
    const state = classifyAccuracy(acc);

    setLight(state);

    document.getElementById('m-accuracy').innerHTML = `${acc}<span class="metric-unit">m</span>`;
    document.getElementById('m-sats').textContent = estimateSats(acc);
    document.getElementById('m-speed').innerHTML = c.speed != null ? `${Math.round(c.speed * 3.6)}<span class="metric-unit">km/h</span>` : `—`;
    document.getElementById('m-altitude').innerHTML = c.altitude != null ? `${Math.round(c.altitude)}<span class="metric-unit">m</span>` : `—`;
    document.getElementById('m-lat').textContent = c.latitude.toFixed(6);
    document.getElementById('m-lon').textContent = c.longitude.toFixed(6);
    document.getElementById('m-time').textContent = now();

    const logMsg = state === 'green'  ? `Precisione ${acc}m — ottimo`
                 : state === 'yellow' ? `Precisione ${acc}m — segnale debole`
                 :                      `Precisione ${acc}m — segnale scarso`;
    addLog(logMsg, state);
  }

  function onError(err) {
    const msgs = {
      1: 'Permesso GPS negato dall\'utente',
      2: 'Posizione non disponibile',
      3: 'Timeout nella richiesta GPS'
    };
    setLight('red');
    document.getElementById('status-label').style.color = '#ef4444';
    document.getElementById('status-label').textContent = 'Errore';
    document.getElementById('status-desc').textContent = msgs[err.code] || 'Errore sconosciuto';
    addLog(msgs[err.code] || 'Errore GPS', 'red');
    resetUI();
  }

  function startCheck() {
    if (!('geolocation' in navigator)) {
      document.getElementById('status-desc').textContent = 'GPS non supportato dal browser';
      addLog('Geolocation API non supportata', 'red');
      return;
    }

    const btn = document.getElementById('btn-main');
    const stop = document.getElementById('btn-stop');
    btn.disabled = true;
    btn.textContent = 'Localizzazione…';
    stop.style.display = 'block';
    addLog('Richiesta permesso GPS…', 'gray');

    document.getElementById('watch-status').innerHTML = `<div class="watch-indicator"><div class="watch-dot"></div>live</div>`;

    watchId = navigator.geolocation.watchPosition(
      updateMetrics,
      onError,
      { enableHighAccuracy: true, timeout: 15000, maximumAge: 0 }
    );
  }

  function stopWatch() {
    if (watchId !== null) {
      navigator.geolocation.clearWatch(watchId);
      watchId = null;
    }
    addLog('Monitoraggio fermato', 'gray');
    resetUI();
  }

  function resetUI() {
    document.getElementById('btn-main').disabled = false;
    document.getElementById('btn-main').textContent = 'Avvia controllo';
    document.getElementById('btn-stop').style.display = 'none';
    document.getElementById('watch-status').innerHTML = '';
  }
</script>
</body>
</html>
